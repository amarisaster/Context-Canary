name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mcp:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: bun-windows-x64
            ext: .exe
          - os: ubuntu-latest
            target: bun-linux-x64
            ext: ''
          - os: macos-latest
            target: bun-darwin-x64
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: mcp-server
        run: bun install

      - name: Build MCP server
        working-directory: mcp-server
        run: bun build index.js --compile --target=${{ matrix.target }} --outfile=context-canary-mcp${{ matrix.ext }}

      - name: Copy tiktoken WASM
        working-directory: mcp-server
        run: cp node_modules/tiktoken/tiktoken_bg.wasm .

      - name: Upload MCP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.os }}
          path: |
            mcp-server/context-canary-mcp${{ matrix.ext }}
            mcp-server/tiktoken_bg.wasm

  build-overlay:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        working-directory: overlay-app
        run: npm install

      - name: Build Tauri app
        working-directory: overlay-app
        run: npm run tauri build

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: overlay-windows
          path: |
            overlay-app/src-tauri/target/release/context-canary-overlay.exe
            overlay-app/src-tauri/target/release/bundle/msi/*.msi
            overlay-app/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: overlay-linux
          path: |
            overlay-app/src-tauri/target/release/context-canary-overlay
            overlay-app/src-tauri/target/release/bundle/deb/*.deb
            overlay-app/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: overlay-macos
          path: |
            overlay-app/src-tauri/target/release/bundle/dmg/*.dmg
            overlay-app/src-tauri/target/release/bundle/macos/*.app

  release:
    needs: [build-mcp, build-overlay]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release/windows release/linux release/macos

          # Windows
          cp artifacts/mcp-windows-latest/context-canary-mcp.exe release/windows/
          cp artifacts/mcp-windows-latest/tiktoken_bg.wasm release/windows/
          cp artifacts/overlay-windows/context-canary-overlay.exe release/windows/ 2>/dev/null || true
          cp artifacts/overlay-windows/*.msi release/windows/ 2>/dev/null || true
          cp artifacts/overlay-windows/*.exe release/windows/ 2>/dev/null || true

          # Linux
          cp artifacts/mcp-ubuntu-latest/context-canary-mcp release/linux/
          cp artifacts/mcp-ubuntu-latest/tiktoken_bg.wasm release/linux/
          cp artifacts/overlay-linux/context-canary-overlay release/linux/ 2>/dev/null || true
          cp artifacts/overlay-linux/*.deb release/linux/ 2>/dev/null || true
          cp artifacts/overlay-linux/*.AppImage release/linux/ 2>/dev/null || true

          # macOS
          cp artifacts/mcp-macos-latest/context-canary-mcp release/macos/
          cp artifacts/mcp-macos-latest/tiktoken_bg.wasm release/macos/
          cp -r artifacts/overlay-macos/*.dmg release/macos/ 2>/dev/null || true
          cp -r artifacts/overlay-macos/*.app release/macos/ 2>/dev/null || true

          # Create archives
          cd release
          zip -r ../context-canary-windows.zip windows/
          tar -czvf ../context-canary-linux.tar.gz linux/
          zip -r ../context-canary-macos.zip macos/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            context-canary-windows.zip
            context-canary-linux.tar.gz
            context-canary-macos.zip
          generate_release_notes: true
