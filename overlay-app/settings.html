<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canary Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1f;
      color: #fff;
      padding: 20px;
      user-select: none;
    }
    h2 {
      font-size: 14px;
      margin-bottom: 16px;
      color: #ccc;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    label {
      font-size: 13px;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    input {
      width: 60px;
      padding: 6px 8px;
      background: #2a2a30;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      font-size: 13px;
      text-align: center;
    }
    input:focus {
      outline: none;
      border-color: #22c55e;
    }
    .input-group span {
      font-size: 12px;
      color: #888;
    }
    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .save-btn {
      background: #22c55e;
      color: #fff;
    }
    .save-btn:hover {
      background: #16a34a;
    }
    .cancel-btn {
      background: #444;
      color: #ccc;
    }
    .cancel-btn:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <h2>Threshold Settings</h2>
  <div class="row">
    <label>🟡 Warning</label>
    <div class="input-group">
      <input type="number" id="warning" min="1" max="99" value="70">
      <span>%</span>
    </div>
  </div>
  <div class="row">
    <label>🔴 Danger</label>
    <div class="input-group">
      <input type="number" id="danger" min="1" max="99" value="85">
      <span>%</span>
    </div>
  </div>
  <div class="buttons">
    <button class="cancel-btn" id="cancel">Cancel</button>
    <button class="save-btn" id="save">Save</button>
  </div>

  <script type="module" src="/src/settings.js"></script>
</body>
</html>
